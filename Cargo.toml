[package]
name = "hyprbeat"
version = "0.1.0"
edition = "2024"
# 1.85 → 1.88, one step ahead of the .osz import commit: zip 9.6 declares
# rust-version = "1.88" (it becomes the crate floor there, §4); raising it
# now also surfaces the MSRV-gated clippy lints fixed by this commit.
rust-version = "1.88"
description = "An open-source rhythm game that lives on your desktop background, compatible with the osu! beatmap format. Built for Hyprland/Wayland."
license = "MIT"
readme = "README.md"
keywords = ["wayland", "wallpaper", "rhythm-game", "hyprland", "layer-shell"]
categories = ["games", "multimedia"]
# Phase-1 note (CONTEXT.md D-20): the CLI is a minimal hand-rolled parser on
# purpose; clap lands in phase 5 together with the config-file flags (§6).
# Crate stack pinned per CONTEXT.md §4 ("pin versions at phase-1 scaffold").

[dependencies]
smithay-client-toolkit = "0.21.1"
# `system` backend: wgpu surface creation needs raw wl_display/wl_surface
# pointers, which wayland-client only exposes on the libwayland-backed
# backend; `dlopen` loads libwayland-client.so.0 at runtime instead of a
# link-time dependency (present on any Wayland desktop).
wayland-client = { version = "0.31", features = ["system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
# `signals`: phase-2 dev hook — SIGUSR1/SIGUSR2 pause/resume (D-33).
calloop = { version = "0.14", features = ["signals"] }
calloop-wayland-source = "0.4"
wgpu = { version = "30", default-features = false, features = ["wgsl", "vulkan", "gles"] }
raw-window-handle = "0.6"
pollster = "0.4"
png = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# ---- phase 2: audio engine (§4; D-03/D-04/D-16) ----
# cpal raw output callback = the clock + the latency floor (NOT rodio).
# Needs alsa-lib at build time on Linux; the flake devshell already ships it
# (§12.1).
cpal = "0.15"
# Decode mp3/ogg/flac/wav — the formats actually found in .osz zips. Pure
# Rust, no system deps. `pcm` covers uncompressed WAV/FLAC data paths.
symphonia = { version = "0.5", default-features = false, features = [
    "mp3",
    "ogg",
    "vorbis",
    "flac",
    "wav",
    "pcm",
] }
# SHA-256 content addressing for the decode cache + library dedup (§5.2).
sha2 = "0.10"
# XDG base dirs (I-07): ~/.cache/hyprbeat/decoded/<sha256>.f32 etc.
directories = "5"
# ---- phase 3: library index (§5.2, D-13) ----
# index.json read/write. serde was planned for the phase-5 config system
# (§4/§6) and is pulled forward here: a fail-safe JSON reader wants a
# battle-tested parser, and phase 5 reuses both crates unchanged.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ---- phase 3: .osz import (§5.2, D-43/D-44) ----
# Zip container read (importer) + write (in-memory test fixtures).
# `default-features = false` keeps the tree small (§4): store + deflate
# (zopfli write side, flate2/zlib-rs read side) + deflate64 for legacy
# archives — no crypto, no bzip2/zstd/lzma/ppmd, no time feature. zip's
# MSRV (1.88) is the toolchain floor, hence the rust-version bump above.
zip = { version = "9.6", default-features = false, features = [
    "deflate",
    "deflate-flate2",
    "deflate64",
] }

[dev-dependencies]
# §12.3 "Benchmarks (phase 2+): criterion for clock math". Dev-dependency
# only — the release dependency tree stays small (§4, D-36).
# `cargo_bench_support` without the default features keeps the tree minimal
# (no plotters/rayon) while still running under `cargo bench`.
criterion = { version = "0.5", default-features = false, features = [
    "cargo_bench_support",
] }

# criterion replaces the libtest harness for its benches (§12.3)
[[bench]]
name = "audio"
harness = false

[profile.release]
# Defaults are fine for v0.1; §3.6 budgets are measured before any tag.
