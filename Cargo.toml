[package]
name = "hyprbeat"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "An open-source rhythm game that lives on your desktop background, compatible with the osu! beatmap format. Built for Hyprland/Wayland."
license = "MIT"
readme = "README.md"
keywords = ["wayland", "wallpaper", "rhythm-game", "hyprland", "layer-shell"]
categories = ["games", "multimedia"]
# Phase-1 note (CONTEXT.md D-20): the CLI is a minimal hand-rolled parser on
# purpose; clap lands in phase 5 together with the config-file flags (§6).
# Crate stack pinned per CONTEXT.md §4 ("pin versions at phase-1 scaffold").

[dependencies]
smithay-client-toolkit = "0.21.1"
# `system` backend: wgpu surface creation needs raw wl_display/wl_surface
# pointers, which wayland-client only exposes on the libwayland-backed
# backend; `dlopen` loads libwayland-client.so.0 at runtime instead of a
# link-time dependency (present on any Wayland desktop).
wayland-client = { version = "0.31", features = ["system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
calloop = "0.14"
calloop-wayland-source = "0.4"
wgpu = { version = "30", default-features = false, features = ["wgsl", "vulkan", "gles"] }
raw-window-handle = "0.6"
pollster = "0.4"
png = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
# Defaults are fine for v0.1; §3.6 budgets are measured before any tag.
